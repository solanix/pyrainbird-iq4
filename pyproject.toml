[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pyrainbird-iq4"
version = "0.1.1"
description = "Python library for communicating with Rain Bird IQ4 irrigation controllers"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kris Sanders" }]
keywords = ["rain bird", "rainbird", "iq4", "irrigation", "home assistant", "asyncio"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
    "Typing :: Typed",
]

dependencies = [
    "aiohttp>=3.10",
    "pyrainbird>=6.5.0",
]

[project.urls]
Repository = "https://github.com/solanix/pyrainbird-iq4"
Issues = "https://github.com/solanix/pyrainbird-iq4/issues"

[project.scripts]
rainbird-iq4-diagnostic = "pyrainbird_iq4.diagnostic:main"
rainbird-iq4-local-diagnostic = "pyrainbird_iq4.local_diagnostic:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pyrainbird_iq4 = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["pyrainbird_iq4"]
